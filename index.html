<!DOCTYPE html>
<html>
    <style>
.pimg1, .pimg2, .pimg3 {
  position: relative;
  opacity: 0.70;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
.pimg1 {
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQumPJ0AkfRHYnB_8bdzeNuYf5ZScOZ2WTIkQe0wBfjsMWNaL4gdWfJrcky&s=10');
  min-height: 100%;
}
.pimg2 {
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQumPJ0AkfRHYnB_8bdzeNuYf5ZScOZ2WTIkQe0wBfjsMWNaL4gdWfJrcky&s=10');
  min-height: 400px;
}
.pimg3 {
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQumPJ0AkfRHYnB_8bdzeNuYf5ZScOZ2WTIkQe0wBfjsMWNaL4gdWfJrcky&s=10');
  min-height: 400px;
}
.section {
  text-align: center;
  padding: 50px 80px;
}
.section-light {
  background-color: #f4f4f4;
  color: #666;
}
.section-dark {
  background-color: #282e34;
  color: #ddd;
}
.ptext {
  position: absolute;
  top: 50%;
  width: 100%;
  text-align: center;
  color: #000;
  font-size: 27px;
  letter-spacing: 8px;
  text-transform: uppercase;
}
.ptext .border {
  background-color: #111;
  color: #fff;
  padding: 20px;
}
.ptext .border.trans {
  background-color: transparent;
}
@media(max-width:568px){
  .pimg1, .pimg2, .pimg3 {
    background-attachment: scroll;
  }
}
    </style>
    <head>
        <title>Website</title>
        <link rel="stylesheet" href="style.css">
        <span class="border trans" style="font-size:40px;">
            <centre>Welcome All To This Website</centre>
        </span><br>
    </head>

        <section class="section section-dark">
            <h2>Section One</h2>

        </div>

</html>
